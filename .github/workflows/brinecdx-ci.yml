name: BrineCDX CI

on:
  pull_request:
    paths:
      - "codex-rs/exec-server/**"
      - "codex-rs/core/**"
      - "scripts/brinecdx*"
      - ".brinecdx/**"
      - ".github/workflows/brinecdx-ci.yml"

permissions:
  contents: read

jobs:
  exec-boundary:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@v4
      - name: Rust version
        run: rustc --version && cargo --version
      - name: Format
        run: cargo fmt --all -- --check
      - name: Exec-server tests
        run: cargo test -p codex-exec-server environment_provider --lib
      - name: Unified exec shell-semantics tests
        run: cargo test -p codex-core test_get_command --lib

  launcher:
    name: launcher (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Launcher tests
        if: runner.os != 'Windows'
        run: bash scripts/brinecdx_test.sh
      - name: Launcher tests (PowerShell)
        if: runner.os == 'Windows'
        shell: powershell
        run: scripts/brinecdx_test.ps1
